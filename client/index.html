<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    />
    <meta name="keywords" content="朋友圈,复刻,node,sqlite,vue,动态,说说" />
    <meta name="description" content="最美的时光遇见了你" />
    <!-- favicon 跟站点头像保持一致：默认先挂上内置头像，bootstrap 拿到设置后再按实际头像替换 -->
    <link rel="icon" id="site-favicon" href="/uploads/seed/avatar-main.jpg" />
    <link rel="apple-touch-icon" id="site-touch-icon" href="/uploads/seed/avatar-main.jpg" />
    <!-- PWA：安卓 Chrome 菜单里「安装应用」后可全屏独立打开 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09c362" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="壹刻" />
    <title>壹刻</title>
    <script>
      (function () {
        try {
          var h = new Date().getHours();
          var autoNight = h >= 19 || h < 7;
          var manual = localStorage.getItem('pyq_theme_manual');
          var dark = manual ? manual === 'dark' : autoNight;
          if (dark) document.documentElement.classList.add('dark-theme');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
