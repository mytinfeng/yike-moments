<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09c362" />
    <title>离线 · 壹刻</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 32px;
        background: #f5f6f7;
        color: #1a1a1a;
        font: 15px/1.7 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        text-align: center;
      }
      .dot {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(180deg, #0acb68, #059852);
        color: #fff;
        font-size: 28px;
        line-height: 56px;
        font-weight: 700;
      }
      h1 { margin: 4px 0 0; font-size: 17px; font-weight: 600; }
      p { margin: 0; color: #7a7a7a; font-size: 13px; }
      button {
        margin-top: 8px;
        padding: 9px 22px;
        border: 0;
        border-radius: 999px;
        background: #09c362;
        color: #fff;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      @media (prefers-color-scheme: dark) {
        body { background: #141414; color: #ededed; }
        p { color: #8a8a8a; }
      }
    </style>
  </head>
  <body>
    <div class="dot">壹</div>
    <h1>网络好像断了</h1>
    <p>连上网再刷新一下，草稿不会丢。</p>
    <button onclick="location.reload()">重新加载</button>
  </body>
</html>
